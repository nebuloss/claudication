# claudication configuration. Every field is optional; this file shows the defaults.
#
# This file is READ-ONLY to claudication. It is never rewritten, so your comments
# survive. Client credentials are NOT configured here - they live in the state
# database and are created with `claudication keys add -name NAME`.

# Bind address. Use 0.0.0.0:8317 to accept connections from the network.
listen: "127.0.0.1:8317"

# Put the admin API and UI on a second address, leaving `listen` serving only
# the relay and /health.
#
# SET THIS IF THE GATEWAY IS EXPOSED. The admin surface can add and remove
# Claude accounts and mint API keys, and by default it shares one listener with
# /v1 — so publishing the relay publishes that too unless the proxy in front is
# configured to stop it. Splitting them makes the separation the gateway's own:
# bind this to localhost or a management interface and it cannot be reached
# from outside however the proxy is configured.
#
#   listen:       "0.0.0.0:8317"       # the relay, published
#   admin-listen: "127.0.0.1:8318"     # the UI, reachable over SSH only
#
# Leave it empty and one listener serves both, which is right on a machine only
# you can reach.
# admin-listen: "127.0.0.1:8318"

# The base URL clients should point at.
#
# The admin UI tells you what to give a client. While one listener serves
# everything it uses the address your browser is on, which is reachable by
# definition. Once admin-listen splits them that address is the UI, not the
# relay, and the gateway has no way to learn the hostname clients use — so if
# you split them, say it here or the UI will warn that it is guessing.
# public-url: "https://claudication.example.com"

# Durable state: the SQLite database lives here. Defaults to
# $XDG_STATE_HOME/claudication (or ~/.local/state/claudication), and /var/lib/claudication in a
# deployment. claudication refuses to start if this is not writable.
# state-dir: "/var/lib/claudication"

# CIDRs or bare IPs whose X-Forwarded-For header we honour. Leave empty and
# claudication always uses the socket peer address, so a client cannot spoof its way
# past rate limits.
#
# SET THIS if anything fronts the gateway — nginx, Nginx Proxy Manager,
# Traefik, Caddy, a tunnel. Every request then arrives from the proxy, so
# without it:
#
#   - every client shares one anonymous rate-limit bucket, and one scanner
#     burning 60 requests locks everyone out of sign-in;
#   - the access log records the proxy, so requests cannot be told apart;
#   - the session cookie is never marked Secure, because the gateway cannot
#     tell that the browser's half of the connection was HTTPS.
#
# The value is the address the *proxy* connects from, not the client's. Take it
# from the "ip" field in the access log while the proxy is in use.
trusted-proxies: []
#   - "10.0.50.1"      # a single proxy
#   - "10.0.50.0/24"   # or the network it sits on

log:
  level: "info"   # debug | info | warn | error
  format: "json"  # json | text

limits:
  # Default per-API-key budget. Override per key with `claudication keys add -rpm N`.
  requests-per-minute: 600
  # Per-IP budget for requests that have not authenticated yet.
  anon-per-minute: 60
  # Maximum request body. Large-context traffic is legitimately big, but the
  # body is buffered whole so a retry can replay it, and reading it costs
  # roughly 2.5x its size while the buffer grows. Raise this only if you know
  # you need to: a long Claude Code transcript is a couple of megabytes.
  max-body-bytes: 33554432  # 32 MiB

shutdown:
  # How long in-flight requests may finish after SIGINT/SIGTERM. Streaming
  # responses are long-lived, so this is deliberately generous.
  grace: "120s"

# Per-request history, for the Usage tab. The gateway records one row per
# proxied request: which key, which account, which model, how many tokens.
usage:
  # How long rows are kept. 0 turns recording off entirely, for an operator
  # who would rather the gateway remember nothing.
  #
# This is the only thing bounding the event table, and it is what to lower on a
# small disk. Measured, with the index layout as shipped, a usage event costs
# roughly 190-250 bytes on disk including its index entry:
#
#     requests/day   rows at 30 days   database
#            1,000            30,000   ~7 MB
#           10,000           300,000   ~60-75 MB
#           50,000         1,500,000   ~300-375 MB
#
# The access log is the other half and is usually the larger one: about 470
# bytes per proxied request across two lines, bounded by logrotate at 8 x 32 MB
# on an installed system.
#
# Lowering this frees space on the next daily prune. Setting it to 0 turns
# per-request history off entirely; the Usage tab then has nothing to show.
retention-days: 30
  # The window the admin UI summarises by default. Clamped to retention.
  report-days: 7

# Lane A forwards request bodies unchanged, with exactly one exception.
passthrough:
  # Anthropic's subscription backend refuses opus and sonnet unless Claude
  # Code's attribution block is the FIRST system block. It refuses them as a
  # 429 rate_limit_error carrying no rate-limit headers, so it reads as quota
  # exhaustion and is not — haiku is served at the same moment.
  #
  # On by default, so a client that is not Claude Code can reach the models the
  # subscription pays for. A request that already leads with the block is
  # forwarded byte for byte and never rewritten.
  #
  # Set false for strict passthrough: bodies are never edited, and other
  # clients get haiku only.
  claude-code-attribution: true

# Codex CLI, pointed at a claudication gateway.
# Copy to ~/.codex/config.toml and change base_url, and the MCP server's url,
# to your own.
#
#   export CLAUDICATION_API_KEY=clc_...
#   codex
#
# wire_api must be "responses": it is the only wire format Codex speaks.
# env_key names an environment variable, not a key.
#
# The model names are this client's own, one per model setting Codex has —
# the session, /review, spawned agents, memories — and the names a new Codex
# client starts with. What each serves, a Claude model or a GPT one, is chosen
# on the client's page in the gateway, not here: Codex reaches both through
# the gateway, a GPT model as Codex wrote the request and a Claude one
# translated.

model_provider = "claudication"
model = "large"
review_model = "review"

# Fixes Codex guessing a conservative context window for a model it has never
# heard of, which makes it compact the conversation far too early: one entry
# per name above, with the window of the model it serves. See
# codex-models.json next to this file.
model_catalog_json = "~/.codex/claudication-models.json"

[model_providers.claudication]
name = "claudication"
base_url = "https://claudication.example.com/v1"
env_key = "CLAUDICATION_API_KEY"
wire_api = "responses"

# The gateway's MCP server: tools for Codex's own agent about this client
# (mcp__claudication__list_models and the rest; see docs/clients.md, "Agent
# tools (MCP)"). The token is the same key, from the same variable: Codex
# takes an HTTP server's bearer token only from one, and refuses it inline.
# The install command owns this table and no other [mcp_servers.*].
[mcp_servers.claudication]
url = "https://claudication.example.com/mcp"
bearer_token_env_var = "CLAUDICATION_API_KEY"

[agents]
default_subagent_model = "agents"

[memories]
extract_model = "small"
consolidation_model = "small"

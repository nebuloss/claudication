# Codex CLI, pointed at a claudication gateway.
# Copy to ~/.codex/config.toml and change base_url to your own.
#
#   export CLAUDICATION_API_KEY=clc_...
#   codex
#
# wire_api must be "responses": it is the only wire format Codex speaks.
# env_key names an environment variable, not a key.
# model should name an alias the gateway serves. claude-large is its alias for
# real work, and runs Codex on a Claude account, translated; gpt-large runs it
# on a ChatGPT account, sent as Codex wrote it — once one is connected. Which
# model answers either is set in the gateway, under Settings › Aliases, and
# the request goes to whichever accounts serve that model. A name no account
# lists — Codex's own default, gpt-5-codex — is sent as claude-large.

model_provider = "claudication"
model = "claude-large"

# Fixes Codex guessing a conservative context window for a model it has never
# heard of, which makes it compact the conversation far too early.
# See codex-models.json next to this file.
model_catalog_json = "~/.codex/claude-models.json"

[model_providers.claudication]
name = "claudication"
base_url = "https://claudication.example.com/v1"
env_key = "CLAUDICATION_API_KEY"
wire_api = "responses"

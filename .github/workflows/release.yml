name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build a release from'
        required: true

permissions:
  contents: write

jobs:
  binaries:
    name: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          # `git describe` stamps the version into the binary, and a shallow
          # clone has no tags to describe against.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: make web-deps
      - run: make dist

      # Plain binaries rather than tarballs: install.sh then fetches one file,
      # checks it against SHA256SUMS, and is done. There is nothing in an
      # archive here worth the extra step — the UI is inside the binary.
      #
      # The release notes come from the tag's own message. --generate-notes
      # builds a changelog out of merged pull requests, and nothing here goes
      # through one, so every release page from v0.1.0 to v0.4.0 came out as a
      # bare compare link while the text describing the release sat in the tag
      # where only `git show` would find it.
      #
      # Re-runnable on purpose: a workflow_dispatch against a tag that already
      # has a release updates it rather than failing, which is what makes it
      # possible to backfill the notes on a release published before this.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu
          # Only an annotated tag has a message of its own. On a lightweight
          # one %(contents) quietly falls through to the tagged commit's
          # message, which is not a release note and would be published as if
          # it were — so ask what kind of object this is rather than trusting
          # a non-empty answer.
          if [ "$(git cat-file -t "$TAG")" = tag ]; then
            title=$(git tag -l --format='%(contents:subject)' "$TAG")
            git tag -l --format='%(contents:body)' "$TAG" > notes.md
          else
            title="$TAG"
            : > notes.md
          fi
          [ -n "$title" ] || title="$TAG"

          if gh release view "$TAG" >/dev/null 2>&1; then
            # Already published: update it. `gh release edit` has no
            # --generate-notes, so with nothing to say leave the notes alone
            # rather than blanking whatever is there.
            if [ -s notes.md ]; then
              gh release edit "$TAG" --title "$title" --notes-file notes.md
            else
              gh release edit "$TAG" --title "$title"
            fi
            gh release upload "$TAG" dist/release/* --clobber
          elif [ -s notes.md ]; then
            # An annotated tag: its body is the release notes, verbatim.
            gh release create "$TAG" --title "$title" \
              --notes-file notes.md --verify-tag dist/release/*
          else
            # A lightweight tag has no message to take. Fall back rather than
            # publishing an empty page.
            gh release create "$TAG" --title "$title" \
              --generate-notes --verify-tag dist/release/*
          fi

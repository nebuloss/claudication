<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="claudication">
  <!--
    A vessel that narrows and opens again — a stenosis, which is what
    claudication actually is: flow restricted at a point, so the limp comes on
    under load and eases at rest. The same picture as a gateway under a rate
    limit, which is the joke.

    Drawn as two walls rather than a filled shape so it survives being scaled
    to 16px: at that size a fill closes up and reads as a blob, while a pinch
    between two strokes still reads as a pinch. The dot is what is getting
    through.
  -->
  <g fill="none" stroke="#c96442" stroke-width="3.5" stroke-linecap="round">
    <path d="M3 8c6.5 0 6.5 6 10 6s3.5-6 10-6" />
    <path d="M3 24c6.5 0 6.5-6 10-6s3.5 6 10 6" />
  </g>
  <circle cx="27.5" cy="16" r="2.75" fill="#c96442" />
</svg>

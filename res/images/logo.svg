<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 128" width="600" height="128" role="img" aria-labelledby="title desc">
  <title id="title">claudication</title>
  <desc id="desc">A rounded mark holding an open C with a halting line of steps — it keeps walking — beside the word claudication.</desc>
  <style>
    .word { fill: #2b211c; }
    .tag { fill: #7a6a62; }
    @media (prefers-color-scheme: dark) {
      .word { fill: #f4ece6; }
      .tag { fill: #b9aaa1; }
    }
  </style>
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2876a"/>
      <stop offset="1" stop-color="#b4553d"/>
    </linearGradient>
  </defs>
  <!-- The mark: a badge, an open C, and three steps, the second one short. -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#badge)"/>
  <path d="M86 40 A30 30 0 1 0 86 88" fill="none" stroke="#fff8f3" stroke-width="12" stroke-linecap="round"/>
  <circle cx="70" cy="64" r="6" fill="#fff8f3"/>
  <circle cx="84" cy="64" r="6" fill="#fff8f3" opacity="0.8"/>
  <circle cx="104" cy="64" r="6" fill="#fff8f3" opacity="0.6"/>
  <!-- The word. -->
  <text class="word" x="144" y="74" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="650" letter-spacing="-0.5">claudication</text>
  <text class="tag" x="146" y="102" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" letter-spacing="0.3">it keeps walking, and tells you where the narrowing is</text>
</svg>

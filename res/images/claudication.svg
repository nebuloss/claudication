<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 128" width="640" height="128" role="img" aria-labelledby="title desc">
  <title id="title">claudication</title>
  <desc id="desc">A vessel that narrows and opens again, with a dot getting through — the app's own mark — beside the word claudication.</desc>
  <style>
    .word { fill: #2b211c; }
    .tag { fill: #7a6a62; }
    @media (prefers-color-scheme: dark) {
      .word { fill: #f4ece6; }
      .tag { fill: #b9aaa1; }
    }
  </style>
  <!-- The mark: web/public/favicon.svg, drawn four times over. Keep the two
       the same picture; the favicon's comment says what it shows. -->
  <g transform="translate(4 0) scale(4)">
    <g fill="none" stroke="#c96442" stroke-width="3.5" stroke-linecap="round">
      <path d="M3 8c6.5 0 6.5 6 10 6s3.5-6 10-6" />
      <path d="M3 24c6.5 0 6.5-6 10-6s3.5 6 10 6" />
    </g>
    <circle cx="27.5" cy="16" r="2.75" fill="#c96442" />
  </g>
  <!-- The word. -->
  <text class="word" x="144" y="74" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="650" letter-spacing="-0.5">claudication</text>
  <text class="tag" x="146" y="102" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" letter-spacing="0.3">it keeps walking, and tells you where the narrowing is</text>
</svg>
